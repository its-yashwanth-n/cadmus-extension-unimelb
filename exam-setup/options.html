<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cadmus Exam Tools options</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-mode="options">
  <h1 id="title"></h1>
  <form id="fields"></form>
  <p class="note">Changes are saved automatically.</p>

  <div class="quick">
    <b>Quick run</b>
    <label class="cadmus-row"><input type="checkbox" id="oneClick">
      One-click: clicking the toolbar icon applies these settings straight away</label>
    <p class="note">Keyboard shortcut: <b id="shortcut">not set</b>. To change it, go to
      <code>chrome://extensions/shortcuts</code> in Chrome, or about:addons → ⚙ → Manage Extension Shortcuts in Firefox.</p>
  </div>

  <script src="config.js"></script>
  <script src="form.js"></script>
  <script src="runner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
